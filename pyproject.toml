[project]
name = "honkai3-auto-desktop"
version = "1.0.0"
description = "现代化《崩坏3》PC端全自动管家桌面客户端 (免扫码极速登录 + 7大日常全自动闭环托管)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Honkai3 Auto Desktop Contributors" }
]
dependencies = [
    "PySide6>=6.5.0",
    "qfluentwidgets>=0.9.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "requests>=2.28.0",
    "pygetwindow>=0.0.9",
    "pycryptodome>=3.18.0",
    "pyzbar>=0.1.9",
    "qrcode>=7.4.2",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
